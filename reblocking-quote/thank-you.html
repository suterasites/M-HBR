  <style>
    :root {
      --brand-orange: #E66A2C;
      --brand-charcoal: #1A1614;
      --brand-cream: #F5EFE6;
      --ink-soft: #4C4640;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; color: var(--brand-charcoal); background: var(--brand-cream); line-height: 1.65; -webkit-font-smoothing: antialiased; }
    .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .card { background: #fff; border-radius: 16px; padding: 48px 32px; max-width: 540px; width: 100%; text-align: center; box-shadow: 0 1px 2px rgba(10,10,10,0.04), 0 12px 32px rgba(10,10,10,0.07); }
    @media (min-width: 640px) { .card { padding: 56px 48px; } }
    .check { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 999px; background: var(--brand-orange); color: #fff; margin-bottom: 20px; }
    h1 { font-family: 'Archivo', sans-serif; font-weight: 900; font-size: clamp(1.8rem, 4vw, 2.6rem); text-transform: uppercase; line-height: 1.05; margin: 0 0 14px; }
    p { color: var(--ink-soft); margin: 0 0 12px; }
    .row { display: flex; flex-direction: column; gap: 12px; margin-top: 28px; }
    @media (min-width: 480px) { .row { flex-direction: row; justify-content: center; } }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0.95rem 1.7rem; border-radius: 6px; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 0.95rem; letter-spacing: 0.04em; text-transform: uppercase; text-decoration: none; transition: transform 180ms ease, background-color 200ms ease; border: 1.5px solid transparent; }
    .btn-primary { background: var(--brand-orange); color: #fff; }
    .btn-primary:hover { background: #C95217; transform: translateY(-1px); }
    .btn-outline { border-color: var(--brand-charcoal); color: var(--brand-charcoal); }
    .btn-outline:hover { background: var(--brand-charcoal); color: #fff; transform: translateY(-1px); }
  </style>
</head>
